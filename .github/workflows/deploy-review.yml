name: Deploy Tech Judge review
on:
  push:
    branches: [codex/astro-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: techjudge-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_CONTACT_ENABLED: ${{ vars.PUBLIC_CONTACT_ENABLED }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - run: npm run verify
      - run: node scripts/verify-contact.mjs
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret to enable review deployments."
            exit 1
          fi
      - name: Deploy existing review project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '76e5ce4bb2967ca602ba9c05a25e826d'
          wranglerVersion: '4.136.1'
          command: pages deploy dist --project-name techjudge-review --branch review
